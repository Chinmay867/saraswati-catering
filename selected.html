<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selected Items | Saraswati Catering</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="selected.css">

</head>

<body>

<div class="selected-page">

    <!-- Header -->

    <div class="selected-header">

        <div class="logo">🍽️</div>

        <h1>Saraswati Catering</h1>

        <p>Selected Menu Items</p>

    </div>


    <!-- Main Card -->

    <div class="selected-card">

        <div class="card-title">

            <span>🛒</span>

            <div>
                <h2>Your Selected Items</h2>
                <p>Review your menu before creating the bill</p>
            </div>

        </div>


        <!-- Selected Items -->

        <div id="selectedItemsContainer">

            <!-- Items JavaScript se aayenge -->

        </div>


        <!-- Total -->

        <div class="selected-summary">

            <span>Total Selected Items</span>

            <strong id="totalItems">0</strong>

        </div>


        <!-- Buttons -->

        <div class="selected-buttons">

            <button
                type="button"
                class="back-btn"
                onclick="history.back()">

                ⬅ Back

            </button>


            <button
                type="button"
                class="continue-btn"
                id="continueBtn">

                Create Bill ➜

            </button>

        </div>

    </div>


    <div class="footer-text">

        ✨ Please review your selections carefully ✨

    </div>

</div>


<script src="selected.js"></script>

</body>

</html>
