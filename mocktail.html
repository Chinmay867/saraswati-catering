<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mocktail Menu</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mocktail.css">

</head>
<body>

<div class="container">

<h1>🍹 Mocktail Menu</h1>
<p>Select Your Mocktail</p>

<div class="mocktail-grid">

    <!-- 1 -->
    <div class="item-card">

       <img src="images/virgin-mojito.png" alt="Virgin Mojito">

        <h3>Virgin Mojito</h3>

        <p>
            Fresh lime mixed with sparkling soda.
        </p>

        <button class="select-btn" data-item="Virgin Mojito">Select</button>

    </div>

    <!-- 2 -->
    

    <!-- 3 -->

    <div class="item-card">

        <img src="images/blue-hawaii.png" alt="Blue Hawaii">

        <h3>Blue Hawaii</h3>

        <p>
            Refreshing tropical blue drink.
        </p>

        <button class="select-btn" data-item="Blue Hawaii">Select</button>

    </div>

    <!-- 4 -->

    <div class="item-card">

        <img src="images/pink-lady.png" alt="Pink Lady">

        <h3>Pink Lady</h3>

        <p>
            Sweet strawberry refreshing drink.
        </p>

        <button class="select-btn" data-item="Pink Lady">Select</button>

    </div>

    <!-- 5 -->

    <div class="item-card">

        <img src="images/masala-cold-drink.png" alt="Masala Cold Drink">

        <h3>Masala Cold Drink</h3>

        <p>
            Lemon with Indian spices.
        </p>

        <button class="select-btn" data-item="Masala Cold Drink">Select</button>

    </div>

    <!-- 6 -->

    

</div>

<div class="btn-group">

<a href="menu.html" class="btn">
⬅ Back
</a>

<button id="selectedBtn">
🛒 Selected : 0
</button>

<button id="saveBtn">
💾 Save & Back
</button>

</div>

</div>

<script src="mocktail.js"></script>

</body>
</html>
