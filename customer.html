<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Details | Saraswati Catering</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="customer.css">

</head>

<body>

<div class="customer-page">

    <!-- Header -->
    <div class="customer-header">

        <div class="logo">🍽️</div>

        <h1>Saraswati Catering</h1>

        <p>Premium Catering • Elegant Taste • Memorable Events</p>

    </div>


    <!-- Main Card -->
    <div class="customer-card">

        <div class="card-title">
            <span>📋</span>

            <div>
                <h2>Customer Details</h2>
                <p>Please enter your event information</p>
            </div>
        </div>


        <form id="customerForm">

            <!-- Customer Name -->
            <div class="form-group">

                <label>👤 Customer Name</label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Mobile -->
            <div class="form-group">

                <label>📞 Mobile Number</label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    required
                >

            </div>


            <!-- Event Type -->
<div class="form-group">

    <label>🎉 Event Type</label>

    <div class="event-type-grid">

        <button type="button" class="event-option" data-event="Birthday">
            🎂 Birthday
        </button>

        <button type="button" class="event-option" data-event="Marriage">
            💍 Marriage
        </button>

        <button type="button" class="event-option" data-event="Reception">
            🥂 Reception
        </button>

        <button type="button" class="event-option" data-event="Others">
            📦 Others
        </button>

    </div>

    <input type="hidden" id="eventType" required>

</div>


<!-- Date + Members -->
<div class="form-row">

    <div class="form-group">

        <label>📅 Event Date</label>

        <input
            type="date"
            id="eventDate"
            required
        >

    </div>

    <div class="form-group">

        <label>👥 Number of Members</label>

        <input
            type="number"
            id="members"
            min="1"
            placeholder="e.g. 100"
            required
        >

    </div>

</div>


<!-- Address -->
<div class="form-group">

    <label>📍 Event / Delivery Address</label>

    <textarea
        id="address"
        rows="3"
        placeholder="Enter complete address"
        required
    ></textarea>

</div>

            <!-- Buttons -->
            <div class="customer-buttons">

                <a href="menu.html" class="back-btn">
                    ⬅ Back
                </a>

                <button type="submit" class="continue-btn">
                    Continue ➜
                </button>

            </div>

        </form>

    </div>


    <div class="footer-text">
        ✨ Thank you for choosing Saraswati Catering ✨
    </div>

</div>


<script src="customer.js"></script>

</body>
</html>
